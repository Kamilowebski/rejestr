<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rejestr maszyn</title>

<meta name="description" content="Rejestr maszyn — lokalny spis urządzeń sieciowych z adresami IP, zależnościami, lokalizacjami i szybkimi komendami.">
<meta name="keywords" content="rejestr maszyn, inwentarz, sieć, IP, zależności, monitoring">
<meta name="author" content="Kamil Owębski">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8fafc">

<meta property="og:type" content="website">
<meta property="og:title" content="Rejestr maszyn">
<meta property="og:description" content="Lokalny rejestr urządzeń sieciowych z adresami IP i zależnościami.">
<meta property="og:locale" content="pl_PL">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='7' y='8' width='18' height='5' rx='1.5' fill='white'/%3E%3Crect x='7' y='14' width='18' height='5' rx='1.5' fill='white'/%3E%3Crect x='7' y='20' width='18' height='5' rx='1.5' fill='white'/%3E%3C/svg%3E">

<script>
try {
  var s = JSON.parse(localStorage.getItem('machines_settings')) || {};
  var t = s.theme;
  var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark');
} catch(e){}
</script>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="container">
  <header class="app-header">
    <div>
      <h1>Rejestr maszyn</h1>
      <p id="count" class="subtitle"></p>
    </div>
    <div class="toolbar">
      <button id="add" class="btn btn-primary"><span id="icoAdd"></span>Dodaj</button>
      <button id="pg" class="btn" title="Skrypt PowerShell pingujący kluczowe maszyny"><span id="icoPg"></span><span class="hide-sm">Ping</span></button>
      <button id="exp" class="btn" title="Eksport JSON"><span id="icoExp"></span><span class="hide-sm">Eksport</span></button>
      <button id="imp" class="btn" title="Import JSON"><span id="icoImp"></span><span class="hide-sm">Import</span></button>
      <button id="cfgBtn" class="btn" title="Ustawienia"><span id="icoCfg"></span><span class="hide-sm">Ustawienia</span></button>
      <button id="themeToggle" class="btn btn-icon" title="Tryb dzień/noc" aria-label="Tryb dzień/noc"><span id="icoTheme"></span></button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <div id="warn" class="alert d-none">
    Brak dostępu do localStorage — dane nie będą zapisywane. Otwórz stronę bezpośrednio (nie w ramce) lub użyj Importu JSON.
  </div>

  <section class="card filters">
    <div class="filter-row">
      <input id="q" class="input" placeholder="Szukaj: nazwa, IP, lokalizacja, typ, zależności…">
      <select id="loc" class="input"></select>
      <select id="typ" class="input"></select>
    </div>
    <div id="stats" class="chips"></div>
  </section>

  <section class="card table-card">
    <div class="table-wrap">
      <table>
        <colgroup>
          <col style="width:22%">
          <col style="width:10%">
          <col style="width:12%">
          <col style="width:28%">
          <col style="width:20%">
          <col style="width:8%">
        </colgroup>
        <thead>
          <tr>
            <th data-sort="name">Nazwa</th>
            <th data-sort="type">Typ</th>
            <th data-sort="location">Lokalizacja</th>
            <th data-sort="ip">Adresy IP</th>
            <th>Zależności</th>
            <th class="text-end">Akcje</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty d-none"></div>
  </section>
</main>

<!-- Modal: maszyna -->
<dialog id="modal" class="dialog"><form id="form" class="dialog-body">
  <h2 id="mtitle" class="dialog-title"></h2>
  <input type="hidden" id="fId">
  <div class="field">
    <label for="fName">Nazwa hosta *</label>
    <input id="fName" required class="input">
  </div>
  <div class="field-row">
    <div class="field">
      <label for="fType">Typ</label>
      <select id="fType" class="input"></select>
    </div>
    <div class="field">
      <label for="fLoc">Lokalizacja</label>
      <input id="fLoc" list="locList" class="input">
    </div>
  </div>
  <datalist id="locList"></datalist>
  <div class="field">
    <div class="flex justify-between items-center mb-1">
      <label style="margin:0">Adresy IP</label>
      <button type="button" id="addIp" class="btn btn-sm btn-ghost" style="color:var(--primary)">+ Dodaj IP</button>
    </div>
    <div id="ips"></div>
  </div>
  <div class="field">
    <label for="depQ">Zależy od</label>
    <div id="depChips" class="chips mb-2"></div>
    <input id="depQ" autocomplete="off" placeholder="Wpisz nazwę, IP lub lokalizację…" class="input">
    <div id="depList" class="dep-list d-none"></div>
  </div>
  <label class="flex items-center gap-2 text-sm" style="margin-bottom:1rem">
    <input type="checkbox" id="fKey" class="checkbox"> Sprzęt kluczowy
  </label>
  <div class="field">
    <label for="fNote">Notatka</label>
    <textarea id="fNote" rows="2" class="input"></textarea>
  </div>
  <div class="dialog-actions">
    <button type="button" id="cancel" class="btn">Anuluj</button>
    <button class="btn btn-primary">Zapisz</button>
  </div>
</form></dialog>

<!-- Modal: ustawienia -->
<dialog id="cfgModal" class="dialog"><form id="cfgForm" class="dialog-body">
  <h2 class="dialog-title">Ustawienia</h2>
  <div class="field">
    <label for="cTheme">Motyw</label>
    <select id="cTheme" class="input">
      <option value="light">Jasny</option>
      <option value="dark">Ciemny</option>
      <option value="auto">Zgodny z systemem</option>
    </select>
  </div>
  <div class="field">
    <label>Widoczne przyciski</label>
    <div class="flex flex-wrap gap-3 text-sm">
      <label class="flex items-center gap-2"><input type="checkbox" id="sPing" class="checkbox"> Ping</label>
      <label class="flex items-center gap-2"><input type="checkbox" id="sVnc" class="checkbox"> VNC</label>
      <label class="flex items-center gap-2"><input type="checkbox" id="sWeb" class="checkbox"> WWW</label>
      <label class="flex items-center gap-2"><input type="checkbox" id="sScan" class="checkbox"> Ping grupy</label>
    </div>
  </div>
  <div class="field">
    <label for="cPing">Parametry ping</label>
    <input id="cPing" class="input text-mono" placeholder="np. -a -t">
  </div>
  <div class="field-row">
    <div class="field">
      <label for="cSsh">Login SSH</label>
      <input id="cSsh" class="input">
    </div>
    <div class="field">
      <label for="cPort">Port VNC</label>
      <input id="cPort" type="number" min="1" max="65535" class="input">
    </div>
  </div>
  <p id="cPrev" class="preview"></p>

  <div class="section">
    <div class="section-title">Własne kategorie</div>
    <div id="catList"></div>
    <div class="flex gap-2 mt-2">
      <input id="catNew" maxlength="24" placeholder="Nazwa kategorii" class="input">
      <button type="button" id="catAdd" class="btn">Dodaj</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Własne komendy</div>
    <p class="text-xs text-muted mb-2">Zmienne: <code>{host}</code> <code>{name}</code> <code>{ip}</code> <code>{user}</code> <code>{port}</code></p>
    <div id="cList"></div>
    <div class="cmd-grid mt-2">
      <input id="cmdLabel" maxlength="12" placeholder="Etykieta" class="input input-sm">
      <input id="cmdTpl" placeholder="np. mstsc /v:{host}" class="input input-sm text-mono">
      <select id="cmdTarget" class="input input-sm">
        <option value="ip">Do IP</option>
        <option value="name">Do nazwy</option>
        <option value="both">Do obu</option>
      </select>
    </div>
    <button type="button" id="cmdAdd" class="btn btn-sm btn-ghost mt-2" style="color:var(--primary)">+ Dodaj komendę</button>
  </div>

  <div class="dialog-actions">
    <button type="button" id="cCancel" class="btn">Anuluj</button>
    <button class="btn btn-primary">Zapisz</button>
  </div>
</form></dialog>

<!-- Modal: kopia zapasowa -->
<dialog id="bkModal" class="dialog"><div class="dialog-body">
  <h2 id="bkTitle" class="dialog-title"></h2>
  <p id="bkHelp" class="text-sm text-muted mb-3"></p>
  <div id="bkImpBox" class="flex flex-wrap gap-2 mb-3">
    <button type="button" id="bkPick" class="btn">Wybierz plik JSON</button>
    <select id="bkMode" class="input" style="flex:1 1 200px;width:auto">
      <option value="merge">Dołącz i zaktualizuj</option>
      <option value="replace">Zastąp wszystkie dane</option>
    </select>
  </div>
  <textarea id="bkText" rows="10" spellcheck="false" class="input text-mono text-xs"></textarea>
  <div class="dialog-actions">
    <button type="button" id="bkClose" class="btn">Zamknij</button>
    <button type="button" id="bkCopy" class="btn">Kopiuj</button>
    <button type="button" id="bkDl" class="btn btn-primary">Pobierz</button>
    <button type="button" id="bkGo" class="btn btn-primary">Wczytaj</button>
  </div>
</div></dialog>

<!-- Modal: ping -->
<dialog id="pgModal" class="dialog dialog-lg"><div class="dialog-body">
  <h2 id="pgTitle" class="dialog-title">Ping</h2>
  <p id="pgHelp" class="text-sm text-muted mb-3"></p>
  <div class="ping-controls">
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="pgLive" checked class="checkbox"> Odświeżaj na żywo</label>
    <label class="flex items-center gap-2 text-sm">Co <input type="number" id="pgEvery" min="300" max="60000" step="100" value="1000" class="input input-sm" style="width:6rem"> ms</label>
    <label class="flex items-center gap-2 text-sm">Timeout <input type="number" id="pgTimeout" min="200" max="10000" step="100" value="900" class="input input-sm" style="width:6rem"> ms</label>
  </div>
  <textarea id="pgText" rows="14" readonly spellcheck="false" class="input text-mono text-xs"></textarea>
  <div class="dialog-actions">
    <button type="button" id="pgClose" class="btn">Zamknij</button>
    <button type="button" id="pgCopy" class="btn">Kopiuj</button>
    <button type="button" id="pgDl" class="btn btn-primary">Pobierz .ps1</button>
  </div>
</div></dialog>

<!-- Modal: potwierdzenie -->
<dialog id="cfmModal" class="dialog dialog-sm"><div class="dialog-body">
  <p id="cfmMsg" class="text-sm" style="margin-bottom:1.5rem"></p>
  <div class="dialog-actions" style="margin-top:0">
    <button type="button" id="cfmNo" class="btn">Anuluj</button>
    <button type="button" id="cfmOk" class="btn btn-danger">Usuń</button>
  </div>
</div></dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
